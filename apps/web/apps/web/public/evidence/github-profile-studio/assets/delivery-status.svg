<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Profile Studio delivery status</title>
  <desc id="desc">Repository implementation, tests, types and builds are present; public runtime remains planned.</desc>
  <rect width="1600" height="900" fill="#071d34"/>
  <text x="90" y="110" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#f7f1e3">Delivery status · honest boundary</text>
  <text x="92" y="165" font-family="sans-serif" font-size="24" fill="#b8c7d5">What the repository proves, and what it does not</text>
  <g font-family="sans-serif">
    <rect x="90" y="250" width="650" height="450" rx="18" fill="#0e263d" stroke="#27d7b0" stroke-width="4"/>
    <text x="140" y="320" font-size="32" font-weight="700" fill="#27d7b0">VERIFIED IN REPOSITORY</text>
    <text x="140" y="390" font-size="26" fill="#fff">✓ React profile workspace</text>
    <text x="140" y="445" font-size="26" fill="#fff">✓ Hono / Node and Go APIs</text>
    <text x="140" y="500" font-size="26" fill="#fff">✓ SQLite / Drizzle migration contract</text>
    <text x="140" y="555" font-size="26" fill="#fff">✓ Keychain and safe error tests</text>
    <text x="140" y="610" font-size="26" fill="#fff">✓ CI checks, tests, types and builds</text>
    <rect x="860" y="250" width="650" height="450" rx="18" fill="#2a1d20" stroke="#f1bd57" stroke-width="4"/>
    <text x="910" y="320" font-size="32" font-weight="700" fill="#f1bd57">NOT YET VERIFIED</text>
    <text x="910" y="405" font-size="26" fill="#fff">○ Public runtime URL</text>
    <text x="910" y="470" font-size="26" fill="#fff">○ Cloud deployment resources</text>
    <text x="910" y="535" font-size="26" fill="#fff">○ Production data and logs</text>
    <text x="910" y="600" font-size="26" fill="#fff">○ TLS, uptime and rollback evidence</text>
  </g>
  <text x="90" y="805" font-family="sans-serif" font-size="26" fill="#f7f1e3">Status: local implementation complete · public deployment remains planned</text>
</svg>
