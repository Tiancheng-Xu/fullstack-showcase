<div class="relative overflow-hidden py-unit flex flex-col gap-2 mb-stack-gap">
<div class="flex items-center gap-2">
<div class="w-12 h-12 rounded-full bg-primary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[28px]">add_circle</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">记录成长瞬间</h1>
</div>
<p class="font-body-md text-on-surface-variant max-w-[80%]">选择一个类别，开始记录宝宝的点滴进步吧。</p>

<svg class="w-full h-full text-primary fill-current" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="40"></circle>
</svg>
</div>

<!-- Selection Grid -->
<div class="grid grid-cols-2 gap-stack-gap mb-section-margin">

<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-primary-fixed-variant text-[32px]">baby_changing_station</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">喂奶</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">毫升/次数</span>
</button>
<!-- Sleep -->
<button class="group relative flex flex-col items-center justify-center aspect-square bg-surface-container-lowest rounded-xl shadow-sm active:scale-95 transition-all duration-200 overflow-hidden" onclick="handleSelect('sleep')">
<div class="absolute inset-0 bg-gradient-to-br from-secondary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-secondary-fixed flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-on-secondary-fixed-variant text-[32px]" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface">睡眠</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">时长/质量</span>
</button>
<!-- Height -->

</div>

</button>

<span class="font-headline-md text-headline-md text-on-surface">体重</span>

</button>
</div>

<div class="bg-surface-container-high rounded-lg p-container-padding flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary">lightbulb</span>
</div>
<div class="flex flex-col gap-1">
<h4 class="font-body-lg text-body-lg text-on-surface">温馨提示</h4>
<p class="font-body-md text-body-md text-on-surface-variant">定期记录身高体重可以更好地通过成长曲线观察宝宝的发育状态。建议每月记录一次。</p>
</div>
</div>

<div class="mt-section-margin opacity-40 flex justify-center">
<svg fill="none" height="40" viewbox="0 0 120 40" width="120" xmlns="http://www.w3.org/2000/svg">

<circle class="text-primary" cx="35" cy="10" fill="currentColor" r="3"></circle>
<circle class="text-secondary" cx="85" cy="10" fill="currentColor" r="3"></circle>
</svg>
</div>
<script>
    function handleSelect(type) {
      // 触觉反馈模拟
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(10);
      }
      
      // 添加选中状态的视觉反馈
      const event = new CustomEvent('growth-type-selected', { detail: { type: type } });
      document.dispatchEvent(event);
      
      // 模拟跳转流程
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 px-6 py-3 bg-inverse-surface text-inverse-on-surface rounded-full shadow-xl z-[60] font-body-md animate-bounce';
      toast.innerText = `正在进入${getLabel(type)}表单...`;
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.remove();
        alert(`跳转到 ${type} 记录页面`);
      }, 800);
    }

    function getLabel(type) {
      const labels = {
        'feeding': '喂奶',
        'sleep': '睡眠',
        'height': '身高',
        'weight': '体重'
      };
      return labels[type] || '';
    }
  </script>
