<script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.group');
      
      // Simple scroll Reveal
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('opacity-100', 'translate-y-0');
            entry.target.classList.remove('opacity-0', 'translate-y-4');
          }
        });
      }, { threshold: 0.1 });

      cards.forEach(card => {
        card.classList.add('transition-all', 'duration-700', 'opacity-0', 'translate-y-4');
        observer.observe(card);
      });

      // Micro-interaction for FAB
      const fab = document.getElementById('addMomentBtn');
      fab.addEventListener('click', () => {
        // Sparkle effect simulation
        for(let i=0; i<6; i++) {
          const sparkle = document.createElement('div');
          sparkle.className = 'absolute w-2 h-2 bg-primary-container rounded-full pointer-events-none';
          const angle = (i / 6) * Math.PI * 2;
          const velocity = 40 + Math.random() * 40;
          sparkle.style.left = '50%';
          sparkle.style.top = '50%';
          fab.appendChild(sparkle);
          
          const animation = sparkle.animate([
            { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
            { transform: `translate(${-50 + Math.cos(angle) * velocity}px, ${-50 + Math.sin(angle) * velocity}px) scale(0)`, opacity: 0 }
          ], { duration: 600, easing: 'ease-out' });
          
          animation.onfinish = () => sparkle.remove();
        }
      });
    });
  </script>
