<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mt-4">创建账号</h1>

</div>

<form class="space-y-stack-gap relative z-10" onsubmit="return false;">
<!-- Username Field (Success State) -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2">用户名称</label>
<div class="relative">
<input class="w-full h-[56px] px-6 rounded-lg bg-surface-container-low text-on-surface font-body-md focus:outline-none transition-all" type="text" value="林小夕"/>

<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">visibility_off</span>

</p>
</div>
<!-- Interaction Script for gentle feedback -->
<script>
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.parentElement.classList.add('scale-[1.01]');
        this.parentElement.parentElement.style.transition = 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      });
      input.addEventListener('blur', function() {
        this.parentElement.parentElement.classList.remove('scale-[1.01]');
      });
    });

    // Particle effect on error focus
    const errorFields = document.querySelectorAll('.bg-error-container\\/30');
    errorFields.forEach(field => {
      field.addEventListener('click', () => {
        const rect = field.getBoundingClientRect();
        for(let i=0; i<5; i++) {
          const p = document.createElement('div');
          p.className = 'absolute pointer-events-none bg-error/20 rounded-full';
          p.style.width = Math.random() * 8 + 4 + 'px';
          p.style.height = p.style.width;
          p.style.left = Math.random() * rect.width + 'px';
          p.style.top = Math.random() * rect.height + 'px';
          field.parentElement.appendChild(p);
          
          const anim = p.animate([
            { transform: 'translateY(0) scale(1)', opacity: 0.5 },
            { transform: `translateY(-40px) scale(0)`, opacity: 0 }
          ], { duration: 600, easing: 'ease-out' });
          
          anim.onfinish = () => p.remove();
        }
      });
    });
  </script>
