  </head><body class="bg-background font-body-md text-on-background"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-container-padding flex items-center justify-between"><div class="flex items-center gap-2"><img alt="Nurture &amp; Bloom Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIEpV38UNhUFI2q7TaJzbxwywQvkiXtA02obtHzaFv-prnGcRusLXt4MOt_hxr6F8LiE0F9LxT-iyphe54Tp1--HLEfEI2MdImtMofebgMmq4i69XTgSduD_7CYUxDP7o_PuGESabwo-A6z0QUDFh8RUYGqiQEjc8zgFb135VO9SLPY7FyacsE5XnlUBfNXy7Sh2veF2abjFB9BLohGSDmLmXzWS6wbpZEo2D655qcjuB8lYN1OAS6"/><span class="font-headline-md text-headline-md text-primary">育爱成长</span></div><div class="flex items-center gap-3"><button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container rounded-full transition-colors"><span class="material-symbols-outlined">notifications</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-24 bg-background min-h-screen"><div class="flex flex-col w-full">
<!-- Back Button & Header -->
<div class="px-container-padding py-unit flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant active:scale-95 transition-transform" onclick="history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">编辑宝宝资料</h1>
</div>
<!-- Content Scroll Area -->
<div class="px-container-padding space-y-stack-gap">
<!-- Avatar Section -->
<div class="flex flex-col items-center justify-center py-6 relative">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden shadow-xl ring-4 ring-surface-container-lowest">
<img class="w-full h-full object-cover" data-alt="A soft, heartwarming close-up portrait of a happy 6-month-old baby with a gentle smile, wearing a cream-colored organic cotton beanie. The background is a soft-focus nursery with warm sunlight filtering through linen curtains. The lighting is ethereal and high-key, emphasizing smooth skin textures and sparkling eyes, following a soft-tactile minimalism aesthetic with warm cream and beige tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUlzsN7ctFtnYl7StATcgMM2OTHci7QXu_GAxQYMDCuYs8JNDfaHITGcB3rusTc07-o7OJAVPgSNB5NBXvqxq5CVMezQXGERAAQs9j2vxJMMPc3o0MFzo9pDqa43N0b6FzLAKmR8UwxNa9rDrUgvVyxXMK2doM9YBXZfvde0fDtTmr1XfM2nvmfEmfsHvLoU7F9wM4v1y8tbbXzxbnIfmDoBStDm_sOzMNgP2bijSeYz7ZAKsZQBW1"/>
</div>
<button class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
</button>
</div>
<p class="mt-4 font-label-sm text-label-sm text-outline">点击更换头像</p>
</div>
<!-- Form Fields -->
<div class="space-y-4">
<!-- Nickname -->
<div class="space-y-2">
<label class="px-2 font-label-sm text-label-sm text-on-surface-variant">宝宝小名</label>
<div class="relative group">
<input class="w-full h-14 px-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-secondary/20 transition-all" placeholder="请输入宝宝的小名" type="text" value="小糯米"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px]">edit</span>
</div>
</div>
<!-- Birth Date -->
<div class="space-y-2">
<label class="px-2 font-label-sm text-label-sm text-on-surface-variant">出生日期</label>
<button class="w-full h-14 px-4 flex items-center justify-between rounded-xl bg-surface-container-lowest text-on-surface font-body-md active:bg-surface-container transition-colors">
<span>2023年 10月 15日</span>
<span class="material-symbols-outlined text-outline text-[20px]">calendar_today</span>
</button>
</div>
<!-- Gender Selection -->
<div class="space-y-2">
<label class="px-2 font-label-sm text-label-sm text-on-surface-variant">宝宝性别</label>
<div class="flex gap-3">
<button class="flex-1 h-14 rounded-xl bg-surface-container-lowest flex items-center justify-center gap-2 font-body-md text-on-surface-variant transition-all border-2 border-transparent" id="gender-boy" onclick="selectGender('boy')">
<span class="material-symbols-outlined text-[20px]">male</span>
            小王子
          </button>
<button class="flex-1 h-14 rounded-xl bg-primary-container flex items-center justify-center gap-2 font-body-md text-on-primary-container transition-all border-2 border-primary/20" id="gender-girl" onclick="selectGender('girl')">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">female</span>
            小公主
          </button>
</div>
</div>
<!-- Blood Type -->
<div class="space-y-2">
<label class="px-2 font-label-sm text-label-sm text-on-surface-variant">宝宝血型</label>
<div class="grid grid-cols-4 gap-2">
<button class="blood-btn h-12 rounded-lg bg-surface-container-lowest font-label-sm text-on-surface-variant active:scale-95 transition-all" onclick="selectBlood('A')">A型</button>
<button class="blood-btn h-12 rounded-lg bg-surface-container-lowest font-label-sm text-on-surface-variant active:scale-95 transition-all" onclick="selectBlood('B')">B型</button>
<button class="blood-btn h-12 rounded-lg bg-secondary-container font-label-sm text-on-secondary-container active:scale-95 transition-all" onclick="selectBlood('O')">O型</button>
<button class="blood-btn h-12 rounded-lg bg-surface-container-lowest font-label-sm text-on-surface-variant active:scale-95 transition-all" onclick="selectBlood('AB')">AB型</button>
</div>
</div>
</div>
<!-- Additional Info Illustration Card -->
<div class="mt-8 p-6 rounded-lg bg-tertiary-container/30 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined">auto_awesome</span>
</div>
<div class="flex-1">
<p class="font-body-md text-on-tertiary-container">完善资料</p>
<p class="text-xs text-on-tertiary-container/80">准确的信息能帮助我们为您生成更精准的成长曲线建议哦。</p>
</div>
</div>
<!-- Save Button Container -->
<div class="pt-8 pb-12">
<button class="w-full h-16 rounded-full bg-primary text-on-primary font-headline-md flex items-center justify-center gap-2 shadow-xl active:scale-[0.98] transition-all" id="save-btn">
<span class="material-symbols-outlined">check_circle</span>
        保存修改
      </button>
</div>
</div>
<script>
    function selectGender(gender) {
      const boyBtn = document.getElementById('gender-boy');
      const girlBtn = document.getElementById('gender-girl');
      
      if (gender === 'boy') {
        boyBtn.classList.replace('bg-surface-container-lowest', 'bg-secondary-container');
        boyBtn.classList.replace('text-on-surface-variant', 'text-on-secondary-container');
        boyBtn.classList.add('border-secondary/20');
        
        girlBtn.classList.replace('bg-primary-container', 'bg-surface-container-lowest');
        girlBtn.classList.replace('text-on-primary-container', 'text-on-surface-variant');
        girlBtn.classList.remove('border-primary/20');
      } else {
        girlBtn.classList.replace('bg-surface-container-lowest', 'bg-primary-container');
        girlBtn.classList.replace('text-on-surface-variant', 'text-on-primary-container');
        girlBtn.classList.add('border-primary/20');
        
        boyBtn.classList.replace('bg-secondary-container', 'bg-surface-container-lowest');
        boyBtn.classList.replace('text-on-secondary-container', 'text-on-surface-variant');
        boyBtn.classList.remove('border-secondary/20');
      }
    }

    function selectBlood(type) {
      const buttons = document.querySelectorAll('.blood-btn');
      buttons.forEach(btn => {
        if (btn.innerText.includes(type)) {
          btn.classList.replace('bg-surface-container-lowest', 'bg-secondary-container');
          btn.classList.replace('text-on-surface-variant', 'text-on-secondary-container');
        } else {
          btn.classList.replace('bg-secondary-container', 'bg-surface-container-lowest');
          btn.classList.replace('text-on-secondary-container', 'text-on-surface-variant');
        }
      });
    }

    document.getElementById('save-btn').addEventListener('click', function() {
      const originalContent = this.innerHTML;
      this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> 正在保存...';
      this.classList.add('opacity-80');
      
      setTimeout(() => {
        this.innerHTML = '<span class="material-symbols-outlined">done_all</span> 保存成功';
        this.classList.replace('bg-primary', 'bg-tertiary');
        
        setTimeout(() => {
          this.innerHTML = originalContent;
          this.classList.replace('bg-tertiary', 'bg-primary');
          this.classList.remove('opacity-80');
        }, 1500);
      }, 800);
    });
  </script>
