<!-- Header Illustration Area -->
<div class="relative w-full h-48 flex items-center justify-center overflow-hidden mb-8">
<div class="absolute inset-0 bg-gradient-to-b from-primary-fixed/30 to-transparent rounded-b-[4rem]"></div>
<div class="relative z-10 w-40 h-40">
<img class="w-full h-full object-contain" data-alt="A soft, whimsical 3D illustration of a seedling sprouting from a glowing golden heart, surrounded by floating pastel bubbles and tiny stars. The style is warm, tactile, and clay-like, using the primary gold and secondary blue palette. The background is a soft cream color that blends into the UI." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCo7n7-kydhCUKhe78m3eN5iU7emLnWUkye9a-BkMOJFm5nAzBT0NDrc1HzV6JmUA25OLwcROfPmoZdUul0vBl5Q-BbxWcH6V1W9SDnQQEFDLBrCSw37u58_UpZD3vkdA5AhLQ14Kh2325Wo2YzyQl7tgycLtQYXwayyVItORBeFkVhg8cvNxAHsogL_fUHfnL8AS6pMougwIrnoQaaSbDRzDniIhIhOVOoTLCkNyuk8J8ZhphWpKNJ"/>
</div>
<!-- Decorative floating elements -->
<div class="absolute top-10 left-10 w-4 h-4 bg-secondary-container rounded-full animate-pulse"></div>
<div class="absolute top-20 right-12 w-6 h-6 bg-tertiary-container rounded-full opacity-50"></div>
</div>
<!-- Title Section -->
<div class="text-center mb-section-margin">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">创建新账号</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">开启您与宝宝的温暖成长旅程</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-gap" id="registerForm" onsubmit="return false;">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2">电子邮箱</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary/20 transition-all shadow-sm" placeholder="example@growth.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2">设置密码</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[56px] pl-12 pr-12 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary/20 transition-all shadow-sm" id="password" placeholder="8-72位字母与数字组合" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" onclick="togglePassword('password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-2">确认密码</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="w-full h-[56px] pl-12 pr-12 bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary/20 transition-all shadow-sm" id="confirmPassword" placeholder="请再次输入密码" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" onclick="togglePassword('confirmPassword', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Requirements Checklist -->
<div class="px-2 py-1 flex flex-wrap gap-x-4 gap-y-2">
<div class="flex items-center gap-1 text-outline" id="req-length">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="font-label-sm text-[12px]">8-72个字符</span>
</div>
<div class="flex items-center gap-1 text-outline" id="req-alpha">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="font-label-sm text-[12px]">包含字母</span>
</div>
<div class="flex items-center gap-1 text-outline" id="req-num">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="font-label-sm text-[12px]">包含数字</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-headline-md text-headline-md shadow-xl active:scale-95 transition-transform mt-4 flex items-center justify-center gap-2 overflow-hidden relative" type="submit">
<span>立即注册</span>
<span class="material-symbols-outlined">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 opacity-0 active:opacity-100 transition-opacity"></div>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center flex flex-col gap-4">
<div class="flex items-center justify-center gap-2">
<span class="font-body-md text-body-md text-on-surface-variant">已有账号？</span>
<button class="font-body-md text-body-md text-primary font-bold hover:underline" onclick="window.location.hash='login'">返回登录</button>
</div>
<!-- Agreement -->
<p class="font-label-sm text-label-sm text-outline px-4 leading-relaxed">
            注册即代表您同意我们的
            <a class="text-secondary underline" href="#">服务条款</a> 和 
            <a class="text-secondary underline" href="#">隐私政策</a>
</p>
</div>
<!-- Empty State / Decoration for Bottom -->
<div class="mt-12 flex justify-center opacity-30">
<div class="flex gap-4">
<span class="material-symbols-outlined text-primary-fixed-dim text-4xl">favorite</span>
<span class="material-symbols-outlined text-secondary-fixed-dim text-4xl">eco</span>
<span class="material-symbols-outlined text-tertiary-fixed-dim text-4xl">child_care</span>
</div>
</div>
</div>
<script>
    function togglePassword(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerText = 'visibility_off';
        } else {
            input.type = 'password';
            icon.innerText = 'visibility';
        }
    }

    const passwordInput = document.getElementById('password');
    const reqs = {
        length: document.getElementById('req-length'),
        alpha: document.getElementById('req-alpha'),
        num: document.getElementById('req-num')
    };

    passwordInput.addEventListener('input', (e) => {
        const val = e.target.value;
        
        // Update UI based on validation
        const hasLength = val.length >= 8 && val.length <= 72;
        const hasAlpha = /[a-zA-Z]/.test(val);
        const hasNum = /[0-9]/.test(val);

        updateReqUI(reqs.length, hasLength);
        updateReqUI(reqs.alpha, hasAlpha);
        updateReqUI(reqs.num, hasNum);
    });

    function updateReqUI(el, isValid) {
        if (isValid) {
            el.classList.remove('text-outline');
            el.classList.add('text-tertiary');
            el.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
        } else {
            el.classList.add('text-outline');
            el.classList.remove('text-tertiary');
            el.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
        }
    }

    // Gentle ripple effect for button
    document.querySelector('form').addEventListener('submit', function(e) {
        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>处理中...</span>';
        setTimeout(() => {
            alert('注册成功！正在为您开启成长之旅...');
            btn.innerHTML = '<span>立即注册</span><span class="material-symbols-outlined">arrow_forward</span>';
        }, 1500);
    });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="nav-active"><div class="flex justify-around items-center h-16 px-unit"><a aria-current="page" class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant nav-active" data-path="growth-home" href="#"><span class="material-symbols-outlined">eco</span><span class="font-label-sm text-label-sm">成长</span></a><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant" data-path="time-moments" href="#"><span class="material-symbols-outlined">auto_stories</span><span class="font-label-sm text-label-sm">时光</span></a><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant" data-path="encyclopedia" href="#"><span class="material-symbols-outlined">menu_book</span><span class="font-label-sm text-label-sm">百科</span></a><a class="flex flex-col items-center justify-center gap-1 w-full text-on-surface-variant" data-path="my-profile" href="#"><span class="material-symbols-outlined">account_circle</span><span class="font-label-sm text-label-sm">我的</span></a></div></nav></body></html>
