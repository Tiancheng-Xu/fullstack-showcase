<script>
    // Entry Animation
    window.addEventListener('DOMContentLoaded', () => {
      const dialog = document.getElementById('logout-dialog');
      setTimeout(() => {
        dialog.classList.remove('scale-95', 'opacity-0', 'translate-y-4');
        dialog.classList.add('scale-100', 'opacity-100', 'translate-y-0');
      }, 50);
    });

    // Close logic
    const closeDialog = () => {
      const dialog = document.getElementById('logout-dialog');
      const overlay = document.getElementById('logout-overlay');
      dialog.classList.add('scale-95', 'opacity-0', 'translate-y-4');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        alert('Returning to Profile...');
        // In a real app: window.location.hash = 'my-profile';
      }, 300);
    };

    document.getElementById('cancel-logout').addEventListener('click', closeDialog);
    document.getElementById('confirm-logout').addEventListener('click', () => {
      // Simulate logout ripple/transition
      const btn = document.getElementById('confirm-logout');
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
      setTimeout(() => {
        alert('Successfully logged out. Redirecting to login...');
      }, 1000);
    });

    // Dismiss on backdrop click
    document.getElementById('logout-overlay').addEventListener('click', (e) => {
      if(e.target.id === 'logout-overlay') closeDialog();
    });
