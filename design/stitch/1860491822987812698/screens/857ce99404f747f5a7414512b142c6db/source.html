<script>
    (function() {
      // Password toggle logic
      const passInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-password');
      const eyeIcon = document.getElementById('eye-icon');

      toggleBtn.addEventListener('click', () => {
        const isPass = passInput.type === 'password';
        passInput.type = isPass ? 'text' : 'password';
        eyeIcon.textContent = isPass ? 'visibility' : 'visibility_off';
        
        // Add a little bump animation to the icon
        eyeIcon.style.transform = 'scale(1.2)';
        setTimeout(() => eyeIcon.style.transform = 'scale(1)', 150);
      });

      // Login button feedback
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');

      loginBtn.addEventListener('click', () => {
        const originalText = btnText.textContent;
        loginBtn.disabled = true;
        btnText.innerHTML = '<span class="flex items-center animate-pulse">正在验证...</span>';
        
        // Simulate loading
        setTimeout(() => {
          btnText.textContent = originalText;
          loginBtn.disabled = false;
          // In a real app, this would redirect
          alert('温馨提示：验证逻辑正在接入中，育见美好时刻即将来临！');
        }, 1500);
      });

      // Input focus aesthetics
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('focus', () => {
          input.parentElement.parentElement.classList.add('scale-[1.01]');
        });
        input.addEventListener('blur', () => {
          input.parentElement.parentElement.classList.remove('scale-[1.01]');
        });
      });
    })();
  </script>
