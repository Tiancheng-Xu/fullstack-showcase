</svg>
</div>
<script>
        function selectGender(el, type) {
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-inner');
                btn.classList.add('bg-surface-container-lowest');
                btn.style.borderColor = 'transparent';
            });
            el.classList.remove('bg-surface-container-lowest');
            el.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-inner');
            el.style.borderColor = 'var(--primary)';
            
            // Add a little pop effect
            el.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(0.95)' },
                { transform: 'scale(1)' }
            ], { duration: 200 });
        }

        function selectBlood(el) {
            document.querySelectorAll('.blood-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary');
                btn.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
            });
            el.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
            el.classList.add('bg-primary', 'text-on-primary');
        }

        function submitProfile() {
            // Simple visual feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>正在开启...</span>';
            setTimeout(() => {
                window.location.hash = 'growth-home';
            }, 1200);
        }
    </script>
