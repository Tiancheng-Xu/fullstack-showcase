name: BabySteps GitHub Pages

on:
  push:
    branches:
      - main
      - codex/web3-onchain-notebook
    paths:
      - .github/workflows/babysteps-pages.yml
      - homeworks/06-web3-dapp/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build BabySteps
    runs-on: ubuntu-latest
    env:
      VITE_ONCHAIN_NOTEBOOK_ADDRESS: "0xeb7216D50a2708a59fef5322e452e34382aFCDaD"
      VITE_BASE_PATH: /fullstack-showcase/
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Web3 source
        run: pnpm web3:check

      - name: Test Web3 source
        run: pnpm web3:test

      - name: Check Web3 types
        run: pnpm web3:typecheck

      - name: Build GitHub Pages artifact
        run: pnpm web3:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: homeworks/06-web3-dapp/web/dist

  deploy:
    name: Deploy BabySteps
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
