name: Verify Showcase Dashboard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-showcase-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: Tiancheng-Xu/.github/.github/workflows/verify-project.yml@main
    with:
      package-manager: pnpm
      node-version: "22"
      pnpm-version: "11.17.0"
      install-command: pnpm --dir apps/web install --frozen-lockfile
      test-command: pnpm test
      typecheck-command: pnpm typecheck
      build-command: pnpm build
      publish-config-path: .github/baby2b-publish.yml
      policy-build-output-paths: apps/web/apps/web/dist
      static-first-output: apps/web/apps/web/dist
      static-first-routes: /dashboard

  sharing-layout:
    name: Sharing layout regression
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: "11.17.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Check this commit's Cloudflare preview
        working-directory: apps/web/apps/web
        env:
          GH_TOKEN: ${{ github.token }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/check-sharing-layout.mjs --sha "${{ github.event.pull_request.head.sha || github.sha }}" --repo "${{ github.repository }}"
      - name: Preserve screenshots and layout findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharing-layout-${{ github.run_id }}
          path: apps/web/apps/web/backstop_data/sharing_layout
          if-no-files-found: warn
          retention-days: 7
